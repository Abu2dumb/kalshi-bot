app = "your-app-name"
primary_region = "sjc"  # choose the region closest to you, e.g. hkg/nrt/sin

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-sensitive config only. NEVER place private keys or API secrets here.
  STREAMLIT_SERVER_HEADLESS = "true"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
