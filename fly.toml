app = "kalshi-bot-ttcwcq"
primary_region = "iad"          # use the region your app is already in

[build]

[env]
  DB_DIR = "/data"

[http_service]
  internal_port = 8501          # Streamlit's default port; keep yours if the Dockerfile uses another
  force_https = true
  auto_stop_machines = "off"    # keeps the bot running when nobody has the page open
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
